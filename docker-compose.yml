# Production-style deployment: one app service behind a reverse proxy on the host (see deploy/).
#
#   cp .env.example .env            # edit: PUBLIC_BASE_URL, SECRET_KEY, MAIL_FROM, ...
#   docker compose build
#   docker compose run --rm app alembic upgrade head                        # explicit migration step (never implicit)
#   docker compose run --rm -it app python -m app.cli setup                 # head admin, mail login, first price
#   docker compose up -d
#
# Run exactly one replica: the application requires a single process (see README).
#
# Volumes
#   coffee_data  the SQLite database (/data). The only thing scripts/backup.sh copies.
#   secrets      the encrypted mail login (/secrets, written by `app.cli setup-mail`). Mounted ONLY into this
#                container, never into /backups, never part of a backup. The mail login itself is not in this
#                file, in .env or in the image; changing SECRET_KEY makes it unreadable (re-run setup-mail).
services:
  app:
    build: .
    image: coffee-ledger:latest
    env_file: .env
    environment:
      # Never fall back to the development defaults (published SECRET_KEY), whatever .env says.
      ENVIRONMENT: production
      # The database always lives in the named volume, whatever .env says.
      DATABASE_URL: sqlite:////data/coffee.db
      # scripts/backup.sh writes here (the bind mount below).
      BACKUP_DIR: /backups
      # Mail: production requires the smtp backend. Host, port, security and sender come from .env;
      # the mail LOGIN is never an environment variable (see `setup-mail` in the README).
      MAIL_BACKEND: smtp
      SMTP_HOST: ${SMTP_HOST:-postout.lrz.de}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      MAIL_FROM: ${MAIL_FROM:-}
      # Where the encrypted mail login lives: the `secrets` volume below.
      SECRETS_DIR: /secrets
      # TRUSTED_PROXY_IPS comes from .env and MUST be set when a reverse proxy runs in front (it is in the
      # documented setup). With the proxy on the host and 127.0.0.1:8000 published, the container sees the
      # compose bridge gateway as the peer, not 127.0.0.1. If the list stays empty, X-Forwarded-For is ignored,
      # ALL visitors share one rate-limit bucket (20 failed sign-ins lock everybody out for 15 minutes) and the
      # app logs a warning at start. Two ways to fill it (README "Trusted proxy addresses"):
      #   a) look the subnet up:  docker network inspect "$(basename "$PWD")_default" \
      #                             --format '{{ (index .IPAM.Config 0).Subnet }}'
      #      and put it into .env, e.g. TRUSTED_PROXY_IPS=172.18.0.0/16
      #   b) pin the subnet below (uncomment `networks:` here and at the bottom) and use
      #      TRUSTED_PROXY_IPS=172.28.0.0/16 in .env; the name and range are examples, pick one that is free.
    ports:
      # Only the local reverse proxy may reach the app; never publish 8000 on a public interface.
      - "127.0.0.1:8000:8000"
    volumes:
      - coffee_data:/data
      # Dedicated volume for the encrypted mail login. Created from the image directory /secrets, which is
      # mode 0700 and owned by the non-root app user (uid 10001). Do not mount it anywhere else.
      - secrets:/secrets
      # Backups written by scripts/backup.sh. Create it first and let the container user write to it:
      #   mkdir -p backups && sudo chown 10001 backups
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    # networks: [default]            # option b): see the comment above and the `networks:` block at the bottom
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  coffee_data:
  secrets:

# Option b) for TRUSTED_PROXY_IPS: a bridge network with a fixed subnet (then the app sees the proxy at 172.28.0.1).
# networks:
#   default:
#     ipam:
#       config:
#         - subnet: 172.28.0.0/16
