name: pip-audit

on:
  push:
  pull_request:
  schedule:
    # Catch newly published advisories even when the lock file is unchanged.
    - cron: "17 6 * * 1"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pip-audit
        run: pip install "pip-audit>=2.7"

      - name: Audit locked dependencies
        run: pip-audit -r requirements.lock
