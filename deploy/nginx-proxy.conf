# Save as /etc/nginx/snippets/coffee-proxy.conf (included by coffee.conf).
proxy_http_version 1.1;
proxy_set_header Connection "";
# Host is forwarded unchanged (the app compares it with the Origin header of form posts).
proxy_set_header Host $host;
# Overwrite, never append, so clients cannot inject X-Forwarded-For.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 30s;
proxy_hide_header X-Powered-By;
# HSTS is added by nginx; drop the application's copy so the header is not sent twice.
proxy_hide_header Strict-Transport-Security;
