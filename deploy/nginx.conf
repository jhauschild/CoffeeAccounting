# nginx reverse proxy for the coffee ledger. Put in /etc/nginx/conf.d/coffee.conf (http context).
# Replace coffee.example.org and the certificate paths (e.g. from certbot). The app listens on
# 127.0.0.1:8000 (docker-compose.yml publishes it on the loopback interface only).
#
# .env must contain:  PUBLIC_BASE_URL=https://coffee.example.org
#                     TRUSTED_PROXY_IPS=<address the proxy connects from, see README "Reverse proxy">

server_tokens off;

upstream coffee_app {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name coffee.example.org;
    # certbot --webroot would add its /.well-known location here.
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name coffee.example.org;

    ssl_certificate     /etc/letsencrypt/live/coffee.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coffee.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:coffee_tls:10m;
    ssl_session_tickets off;

    # Scan, registration and admin forms are tiny; the app enforces 64 KiB as well.
    client_max_body_size 64k;

    # HSTS (nginx drops inherited add_header lines in a block that has its own, so it is repeated below).
    add_header Strict-Transport-Security "max-age=31536000" always;

    # --- Optional: restrict /admin to department / VPN addresses (recommended). Uncomment and edit. ---
    # location /admin {
    #     allow 192.0.2.0/24;
    #     allow 2001:db8::/32;
    #     deny  all;
    #     proxy_pass http://coffee_app;
    #     include /etc/nginx/snippets/coffee-proxy.conf;
    #     proxy_hide_header Cache-Control;
    #     add_header Cache-Control "no-store" always;
    #     add_header Strict-Transport-Security "max-age=31536000" always;
    # }

    # Static files: cache headers come from the application.
    location /static/ {
        proxy_pass http://coffee_app;
        include /etc/nginx/snippets/coffee-proxy.conf;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Everything else is dynamic: never cached.
    location / {
        proxy_pass http://coffee_app;
        include /etc/nginx/snippets/coffee-proxy.conf;
        proxy_hide_header Cache-Control;   # replace the application's header instead of duplicating it
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}
